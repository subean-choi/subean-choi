name: refresh activity rhythm

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_activity.py"
      - ".github/workflows/refresh-activity.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate activity SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_activity.py

      - name: Commit updated activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-lotus.svg
          git diff --cached --quiet || git commit -m "Refresh lotus activity rhythm"
          git push
