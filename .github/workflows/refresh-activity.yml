name: refresh karma log

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate activity SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_activity.py

      - name: Commit updated activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-lotus.svg
          git diff --cached --quiet || git commit -m "Refresh karma log"
          git push

