<svg width="1200" height="470" viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MONK OS — 수빈의 공개 프로필 콘솔</title>
  <desc id="desc">수빈의 컴퓨터 비전 작업과 장난스러운 상태를 보여주는 사이버 선 콘솔.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#30363D" stroke-width="1" opacity=".32"/></pattern>
    <linearGradient id="pinkGold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF5CA8"/><stop offset="1" stop-color="#E7B72B"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="panel"><rect x="2" y="2" width="1196" height="466" rx="10"/></clipPath>
  </defs>
  <rect width="1200" height="470" rx="12" fill="#0D1117"/>
  <rect x="2" y="2" width="1196" height="466" rx="10" fill="none" stroke="#30363D" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="8" rx="4" fill="url(#pinkGold)"/>
  <rect x="2" y="10" width="1196" height="458" fill="url(#grid)" clip-path="url(#panel)"/>

  <g font-family="Noto Sans KR, Arial, sans-serif">
    <text x="46" y="58" fill="#8B949E" font-size="14" font-weight="700" letter-spacing="5">01 / MONK OS</text>
    <circle cx="1110" cy="53" r="6" fill="#FF5CA8" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="1128" y="59" fill="#F0F6FC" font-size="13" font-weight="700" letter-spacing="2">접속 중</text>

    <text x="46" y="155" fill="#F0F6FC" font-size="74" font-weight="900" letter-spacing="-3">SUBIN</text>
    <text x="49" y="194" fill="#FF5CA8" font-size="18" font-weight="800" letter-spacing="3">조용히 보고 / 확실하게 만든다</text>
    <path d="M48 226H520" stroke="#30363D" stroke-width="2"/>
    <text x="48" y="267" fill="#8B949E" font-size="15" letter-spacing="3">공개 작업</text>
    <text x="48" y="310" fill="#F0F6FC" font-size="28" font-weight="700">컴퓨터 비전</text>
    <text x="48" y="351" fill="#C9D1D9" font-size="18">작은 차이 → 더 선명한 시스템</text>
    <text x="48" y="403" fill="#E7B72B" font-size="15">깨달음까지 한 커밋_</text>

    <path d="M594 90V408" stroke="#30363D" stroke-width="2"/>
    <g font-family="Noto Sans KR, Arial, sans-serif">
      <text x="646" y="128" fill="#8B949E" font-size="14" letter-spacing="2">분야</text>
      <text x="820" y="128" fill="#F0F6FC" font-size="20" font-weight="700">컴퓨터 비전</text>
      <path d="M646 152H1146" stroke="#30363D"/>
      <text x="646" y="196" fill="#8B949E" font-size="14" letter-spacing="2">도구</text>
      <text x="820" y="196" fill="#F0F6FC" font-size="18" font-weight="700">PYTHON / PYTORCH / OPENCV</text>
      <path d="M646 220H1146" stroke="#30363D"/>
      <text x="646" y="264" fill="#8B949E" font-size="14" letter-spacing="2">마음</text>
      <text x="820" y="264" fill="#FF5CA8" font-size="20" font-weight="700">대체로 평온</text>
      <path d="M646 288H1146" stroke="#30363D"/>
      <text x="646" y="332" fill="#8B949E" font-size="14" letter-spacing="2">버그</text>
      <text x="820" y="332" fill="#E7B72B" font-size="20" font-weight="700">관찰 중</text>
      <path d="M646 356H1146" stroke="#30363D"/>
      <text x="646" y="400" fill="#8B949E" font-size="14" letter-spacing="2">작업 트리</text>
      <text x="820" y="400" fill="#F0F6FC" font-size="20" font-weight="700">묻지 마세요</text>
    </g>
  </g>

  <rect x="10" y="12" width="3" height="446" fill="#FF5CA8" opacity=".7">
    <animate attributeName="x" values="10;1184;10" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.65;0" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
