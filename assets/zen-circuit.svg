<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Subin's digital zen circuit</title>
  <desc id="desc">An animated golden pixel monk codes on a floating graphite island while lotus petals and abstract signals drift through silver fog.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="400"><stop stop-color="#C9CDD1"/><stop offset=".48" stop-color="#EEF0F2"/><stop offset="1" stop-color="#AEB3B8"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <filter id="pinkGlow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="goldGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
    <path id="graphPath" d="M140 218L285 142L425 220L550 118L690 210L835 132L1058 208"/>
  </defs>
  <rect width="1200" height="400" fill="url(#sky)"/>
  <rect x="-20" y="30" width="1240" height="120" fill="#EEF0F2" opacity=".24"><animate attributeName="x" values="-20;20;-20" dur="12s" repeatCount="indefinite"/></rect>
  <circle cx="780" cy="168" r="168" fill="url(#halo)"/>
  <g fill="#AEB3B8" opacity=".28">
    <path d="M40 268L150 128L255 268H40Z"/><path d="M166 268L320 78L470 268H166Z"/><path d="M780 270L952 92L1122 270H780Z"/>
  </g>
  <g opacity=".17" fill="#6F757B">
    <rect x="644" y="54" width="28" height="28"/><rect x="616" y="82" width="84" height="28"/><rect x="588" y="110" width="140" height="28"/><rect x="560" y="138" width="196" height="28"/>
    <rect x="532" y="166" width="252" height="28"/><rect x="560" y="194" width="196" height="28"/><rect x="588" y="222" width="140" height="28"/>
  </g>
  <use href="#graphPath" fill="none" stroke="#FF6FAE" stroke-width="2" opacity=".7"/>
  <g fill="#FF6FAE" filter="url(#pinkGlow)"><circle cx="140" cy="218" r="7"/><circle cx="285" cy="142" r="7"/><circle cx="425" cy="220" r="7"/><circle cx="550" cy="118" r="7"/><circle cx="690" cy="210" r="7"/><circle cx="835" cy="132" r="7"/><circle cx="1058" cy="208" r="7"/></g>
  <circle r="9" fill="#FFD34E" filter="url(#pinkGlow)"><animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#graphPath"/></animateMotion></circle>
  <g id="island">
    <path d="M522 292H986L926 348H594Z" fill="#24272B"/><path d="M570 348H934L850 390H654Z" fill="#151515"/><rect x="550" y="280" width="408" height="24" fill="#34383D"/><rect x="608" y="304" width="292" height="18" fill="#2B2F33"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(688 90)">
    <circle cx="94" cy="90" r="82" fill="#D6A927" opacity=".24" filter="url(#goldGlow)"/>
    <g fill="#111214"><rect x="55" y="8" width="78" height="14"/><rect x="41" y="22" width="106" height="14"/><rect x="27" y="36" width="134" height="14"/><rect x="20" y="50" width="148" height="28"/></g>
    <rect x="34" y="72" width="120" height="92" fill="#E6AE16"/><rect x="48" y="86" width="92" height="64" fill="#F4BE27"/>
    <rect x="48" y="100" width="34" height="12" rx="6" fill="#111214"/><rect x="110" y="100" width="34" height="12" rx="6" fill="#111214"/><rect x="82" y="130" width="28" height="8" fill="#6D4B00"/>
    <rect x="90" y="72" width="10" height="10" fill="#FFD34E"/><rect x="32" y="164" width="128" height="62" fill="#D8940C"/><rect x="18" y="188" width="156" height="38" fill="#E6AE16"/>
    <g><rect x="22" y="154" width="166" height="88" rx="5" fill="#151515"/><polygon points="22,242 188,242 210,258 0,258" fill="#24272B"/><circle cx="105" cy="198" r="7" fill="#FF6FAE" filter="url(#pinkGlow)"/>
      <animateTransform attributeName="transform" type="rotate" values="0 105 242;-1 105 242;0 105 242" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="688 90;688 84;688 90" dur="5s" repeatCount="indefinite"/>
  </g>
  <g fill="#FF6FAE">
    <path d="M80 94Q104 68 128 94Q104 122 80 94Z"><animateTransform attributeName="transform" type="translate" values="0 0;90 22;180 0" dur="8s" repeatCount="indefinite"/></path>
    <path d="M370 72Q390 48 410 72Q390 96 370 72Z" opacity=".75"><animateTransform attributeName="transform" type="translate" values="0 0;-80 34;-160 8" dur="10s" repeatCount="indefinite"/></path>
    <path d="M1030 88Q1054 62 1078 88Q1054 116 1030 88Z" opacity=".8"><animateTransform attributeName="transform" type="translate" values="0 0;-105 40;-210 4" dur="9s" repeatCount="indefinite"/></path>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#151515">
    <text x="62" y="56" font-size="16" font-weight="800" letter-spacing="5">SUBIN / DIGITAL ZEN MODE</text>
    <text x="62" y="338" font-size="42" font-weight="900" letter-spacing="2">QUIET MIND.</text><text x="62" y="376" font-size="42" font-weight="900" letter-spacing="2">SHARP CODE.</text>
  </g>
</svg>
