<svg width="1200" height="238" viewBox="0 0 1200 238" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">atmosphere로 가는 열린 문</title>
  <desc id="desc">atmosphere 시각 실험으로 이동하는 콘셉트 카드.</desc>
  <defs>
    <linearGradient id="portal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF5CA8"/><stop offset=".55" stop-color="#7B335E"/><stop offset="1" stop-color="#E7B72B"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#8B949E" opacity=".32"/></pattern>
  </defs>
  <rect width="1200" height="238" rx="12" fill="#0D1117"/>
  <rect x="2" y="2" width="1196" height="234" rx="10" fill="none" stroke="#30363D" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="234" rx="10" fill="url(#dots)"/>
  <circle cx="1008" cy="119" r="98" fill="#FF5CA8" opacity=".16" filter="url(#blur)"/>
  <circle cx="1008" cy="119" r="76" fill="none" stroke="url(#portal)" stroke-width="2"/>
  <circle cx="1008" cy="119" r="54" fill="none" stroke="#F0F6FC" stroke-width="1" stroke-dasharray="5 11" opacity=".55">
    <animateTransform attributeName="transform" type="rotate" from="0 1008 119" to="360 1008 119" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1008" cy="119" r="12" fill="#FF5CA8"/>
  <path d="M1008 81L1046 119L1008 157L970 119Z" fill="none" stroke="#E7B72B" stroke-width="2"/>
  <g font-family="Noto Sans KR, Arial, sans-serif">
    <text x="44" y="47" fill="#8B949E" font-size="14" font-weight="700" letter-spacing="5">03 / OPEN PORTAL</text>
    <text x="44" y="113" fill="#F0F6FC" font-size="44" font-weight="900" letter-spacing="-1">ATMOSPHERE ↗</text>
    <text x="46" y="151" fill="#C9D1D9" font-size="19">동굴 밖으로 나온 시각 실험.</text>
    <text x="46" y="197" fill="#FF5CA8" font-size="15" letter-spacing="2">인터페이스 / 시각 시스템 / 실험</text>
